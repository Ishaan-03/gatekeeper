# GATEKEEPER pipeline translated to GitLab CI.
# Translation of .github/workflows/gatekeeper.yml, not run.

stages: [scan, build, test, publish]

variables:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  SEMGREP_VERSION: "1.178.0"
  CHECKOV_VERSION: "3.3.19"
  TRIVY_VERSION: "0.71.2"
  TRIVY_SHA256: "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460"
  IMAGE: "gatekeeper:$CI_COMMIT_SHA"
  AWS_REGION: "eu-west-3"
  AWS_ROLE_ARN: "arn:aws:iam::843109108746:role/gatekeeper-pipeline"
  ECR_REGISTRY: "843109108746.dkr.ecr.eu-west-3.amazonaws.com"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

.install-trivy: &install-trivy
  - curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
  - echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c
  - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

secrets:
  stage: scan
  image: python:3.13-slim
  variables:
    GIT_DEPTH: 0 # full history, like fetch-depth: 0
  script:
    - apt-get update -qq && apt-get install -y -qq curl git > /dev/null
    - curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - gitleaks git -v --redact

sast:
  stage: scan
  image: python:3.13-slim
  script:
    - pip install --quiet "semgrep==${SEMGREP_VERSION}"
    - semgrep scan --config p/python --config p/flask --metrics=off --error app/

iac:
  stage: scan
  image: python:3.13-slim
  script:
    - pip install --quiet "checkov==${CHECKOV_VERSION}"
    - checkov -d . --framework terraform dockerfile kubernetes --skip-path k8s/tests --quiet --compact

sca:
  stage: scan
  image: python:3.13-slim
  script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - *install-trivy
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 app/

build-scan:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  needs: [secrets, sast, iac, sca]
  script:
    - apk add --no-cache curl > /dev/null
    - *install-trivy
    - docker build -t "$IMAGE" .
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
    - trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE"
    - docker save "$IMAGE" -o image.tar
  artifacts:
    paths: [image.tar, sbom.cdx.json]
    expire_in: 1 day

dast:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  needs: [build-scan]
  script:
    - docker load -i image.tar
    - docker network create scan
    - docker run -d --name gk --network scan "$IMAGE"
    - sleep 5
    - cp .zap/rules.tsv "$CI_PROJECT_DIR/rules.tsv"
    - docker run --rm --network scan -v "$CI_PROJECT_DIR:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
        zap-baseline.py -t http://gk:8080/health -c rules.tsv -r report.html
  artifacts:
    when: always
    paths: [report.html]

kubernetes:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  needs: [build-scan]
  script:
    - echo "kind create cluster, load the image, apply k8s/, run the Pod Security and NetworkPolicy tests (same commands as the GitHub job)"

publish:
  stage: publish
  image: docker:27
  services: [docker:27-dind]
  needs: [build-scan, dast, kubernetes]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  id_tokens:
    AWS_TOKEN:
      aud: sts.amazonaws.com
  script:
    - apk add --no-cache aws-cli > /dev/null
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gatekeeper-$CI_PIPELINE_ID"
      --web-identity-token "$AWS_TOKEN"
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text))
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker load -i image.tar
    - docker tag "$IMAGE" "$ECR_REGISTRY/gatekeeper:$CI_COMMIT_SHA"
    - docker push "$ECR_REGISTRY/gatekeeper:$CI_COMMIT_SHA"
